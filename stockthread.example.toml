# stockthread settings. Copy this file to stockthread.toml and edit it.
# Check it with: stockthread check-config
#
# Secrets never go in this file. Set them as environment variables:
#   SLACK_BOT_TOKEN       xoxb-...  always
#   SLACK_APP_TOKEN       xapp-...  for Socket Mode
#   SLACK_SIGNING_SECRET            for HTTP mode
#   INVENTREE_TOKEN                 always
#   LLM_API_KEY                     only with an [llm] section, if the endpoint needs a key

[slack]
transport = "socket"          # "socket" (no public URL needed) or "http"
workspace_id = "T0ACME01"     # events from any other workspace are dropped
app_id = "A0STOCK1"           # events for any other app are dropped
channels = []                 # channel ids to act in. Empty: act nowhere
approvers = []                # user ids that may approve. Empty: nobody can
catch_up_hours = 72           # read posts missed during downtime this far back. 0: off
group_window_seconds = 5      # join sibling messages from one user
plan_expiry_hours = 24

[slack.http]                  # only with transport = "http"
# Slack needs a public https URL: put a reverse proxy that terminates TLS in
# front, and give Slack https://<public host>/slack/events as the request URL.
host = "127.0.0.1"            # in a container: "0.0.0.0"
port = 3000
path = "/slack/events"        # events and button clicks both arrive here

[inventree]
# Use https unless InvenTree runs on the same host or a trusted network:
# INVENTREE_TOKEN is sent with every request.
url = "http://inventree.local:8000"
timeout_seconds = 10

[writes]
enabled = false               # the switch. Off: every movement is a dry-run

[policy]
# Movement types that apply without a click when nothing is in doubt.
# The rest wait for "Apply". [] makes every movement review-first.
auto_apply = ["take_to_vehicle", "take_to_site"]
max_quantity = 100            # a larger quantity is a review reason
# Default source location per movement type, by its whole path: a movement
# of that type that states no source takes it, and can apply with no click.
# Unset: an implied source is a review reason. Example:
# default_source = { take_to_vehicle = "Warehouse/Main Stock", take_to_site = "Warehouse/Main Stock" }
default_source = {}

[apply]
settle_seconds = 120          # must be longer than inventree.timeout_seconds

[undo]
max_age_hours = 168

[storage]
database = "stockthread.db"
# Days after which stored message text is blanked. Longer than plan_expiry_hours,
# catch_up_hours and undo.max_age_hours.
retention_days = 30

# Whose vehicle "my truck" is: Slack user id = the stock location's path in
# InvenTree, exactly as shown there. Create one location per vehicle first.
# A path that is not found is named in the log, and that person's "my truck"
# then waits for a person instead of being guessed.
[vehicles]
# U0SAM0001 = "Vehicles/Truck 1"

# Optional: a model that reads the posts the built-in rules cannot read.
# Without this section no post ever leaves this machine, and those posts get
# no reply. With it, the text of such a post is sent to the endpoint below
# (strings that look like credentials are masked first). Any OpenAI-compatible
# endpoint works: a hosted provider, or a local server such as Ollama.
# [llm]
# base_url = "http://localhost:11434/v1"
# model = "your-model-name"
# timeout_seconds = 30        # for a whole call, at most 120
