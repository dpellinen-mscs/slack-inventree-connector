name: Integration

# Real InvenTree servers in Docker. Runs only when code the integration tests exercise changes: both path lists below
# name every module tests/integration imports and every module a real write depends on, the LLM client excepted
# (tests/test_integration_paths.py keeps them so).
on:
  pull_request:
    paths:
      - "src/stockthread/inventree.py"
      - "src/stockthread/apply.py"
      - "src/stockthread/precondition.py"
      - "src/stockthread/readback.py"
      - "src/stockthread/inverse.py"
      - "src/stockthread/core/marker_check.py"
      - "src/stockthread/writer.py"
      - "src/stockthread/applier.py"
      - "src/stockthread/plan.py"
      - "src/stockthread/plan_record.py"
      - "src/stockthread/gate.py"
      - "src/stockthread/run.py"
      - "src/stockthread/worker.py"
      - "src/stockthread/dry_run.py"
      - "src/stockthread/setup_check.py"
      - "src/stockthread/core/model.py"
      - "src/stockthread/core/matching.py"
      - "src/stockthread/core/requests.py"
      - "src/stockthread/slack/replies.py"
      - "src/stockthread/core/answers.py"
      - "src/stockthread/core/grouping.py"
      - "src/stockthread/core/questions.py"
      - "src/stockthread/core/signals.py"
      - "src/stockthread/core/typed_answers.py"
      - "src/stockthread/core/validate.py"
      - "src/stockthread/picking.py"
      - "src/stockthread/places.py"
      - "src/stockthread/views.py"
      - "src/stockthread/catalog.py"
      - "src/stockthread/config.py"
      - "src/stockthread/core/marker.py"
      - "src/stockthread/core/resolve.py"
      - "src/stockthread/core/write_request.py"
      - "src/stockthread/store/db.py"
      - "src/stockthread/store/migrations/**"
      - "tests/integration/**"
      - "tests/support/**"
      - "eval/catalog/**"
      - "pyproject.toml"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "src/stockthread/inventree.py"
      - "src/stockthread/apply.py"
      - "src/stockthread/precondition.py"
      - "src/stockthread/readback.py"
      - "src/stockthread/inverse.py"
      - "src/stockthread/core/marker_check.py"
      - "src/stockthread/writer.py"
      - "src/stockthread/applier.py"
      - "src/stockthread/plan.py"
      - "src/stockthread/plan_record.py"
      - "src/stockthread/gate.py"
      - "src/stockthread/run.py"
      - "src/stockthread/worker.py"
      - "src/stockthread/dry_run.py"
      - "src/stockthread/setup_check.py"
      - "src/stockthread/core/model.py"
      - "src/stockthread/core/matching.py"
      - "src/stockthread/core/requests.py"
      - "src/stockthread/slack/replies.py"
      - "src/stockthread/core/answers.py"
      - "src/stockthread/core/grouping.py"
      - "src/stockthread/core/questions.py"
      - "src/stockthread/core/signals.py"
      - "src/stockthread/core/typed_answers.py"
      - "src/stockthread/core/validate.py"
      - "src/stockthread/picking.py"
      - "src/stockthread/places.py"
      - "src/stockthread/views.py"
      - "src/stockthread/catalog.py"
      - "src/stockthread/config.py"
      - "src/stockthread/core/marker.py"
      - "src/stockthread/core/resolve.py"
      - "src/stockthread/core/write_request.py"
      - "src/stockthread/store/db.py"
      - "src/stockthread/store/migrations/**"
      - "tests/integration/**"
      - "tests/support/**"
      - "eval/catalog/**"
      - "pyproject.toml"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventree:
    name: InvenTree ${{ matrix.inventree }} (${{ matrix.db }})
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19; bump on purpose
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The tested range in src/stockthread/inventree.py: the current stable release and the two minors before it.
        inventree: ["1.4.3", "1.5.6", "1.6.3"]
        db: [sqlite]
        # PostgreSQL on every pinned version too (design section 5): notes length, atomicity and concurrency differ
        # by database, and 1.4.3's concurrent transfers lose an update only there.
        include:
          - inventree: "1.4.3"
            db: postgres
          - inventree: "1.5.6"
            db: postgres
          - inventree: "1.6.3"
            db: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: make install
      - name: Start InvenTree
        env:
          STOCKTHREAD_IT_TOKEN_FILE: ${{ runner.temp }}/inventree-token
          STOCKTHREAD_IT_DB: ${{ matrix.db }}
        run: tests/integration/start-inventree.sh "inventree/inventree:${{ matrix.inventree }}" >> "$GITHUB_ENV"
      - name: Integration tests
        run: |
          test -n "$STOCKTHREAD_IT_URL"
          .venv/bin/pytest tests/integration -p no:cacheprovider
      - name: Server log
        if: failure()
        run: |
          docker logs --tail 200 stockthread-it
          docker logs --tail 50 stockthread-it-db 2>/dev/null || true
      - name: Tear down
        if: always()
        run: tests/integration/start-inventree.sh --stop
